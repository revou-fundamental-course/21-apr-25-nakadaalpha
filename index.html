<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator Suhu</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <h1>Kalkulator Suhu</h1>

        <!-- ===== Form Pengisian Angka Suhu ===== -->
        <div class="form-group">
            <label for="temperature">Masukkan Suhu:</label>
            <input type="number" id="temperature" placeholder="Contoh: 37" />
        </div>

        <!-- ===== Form Pemilihan Satuan Suhu Konversi ===== -->
        <div class="form-group">
            <label for="unit">Dari Satuan:</label>
            <select id="unit">
          <option value="c">Celsius (°C)</option>
          <option value="f">Fahrenheit (°F)</option>
        </select>
        </div>

        <!-- ===== Tombol Aksi ===== -->
        <div class="button-row">
            <button onclick="convertTemperature()">Konversi</button>
            <button onclick="resetForm()" class="secondary">Reset</button>
            <button onclick="reverseUnit()" class="secondary">Reverse</button>
        </div>

        <!-- ===== Result Box ===== -->
        <div class="result" id="resultBox">
            <p id="convertedValue"></p>
            <p id="explanation"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
